<section>
  @if (isLoading()) {
    <!-- Spinner -->
    <div class="flex justify-center items-center min-h-[400px]">
      <div class="text-center">
        <div class="loading loading-spinner loading-lg text-primary mb-4"></div>
        <p class="text-lg font-medium">Cargando libro...</p>
      </div>
    </div>
  }

  @if (hasError() && !isLoading()) {
    <!-- Estado de error -->
    <div class="alert alert-error mx-4 md:mx-10 my-8">
      <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Error al cargar el libro. Intenta nuevamente.</span>
    </div>
  }

  @if (!isLoading() && !hasError() && bookResource.value()) {
    <!-- Contenido cuando está cargado -->
    <section class="md:mx-10">
      <book-details-cover [book]="bookResource.value()"></book-details-cover>

      <!-- de listas -->
      <div class="mt-6 max-w-md mx-auto">
        <add-to-list [bookId]="bookId" />
      </div>

      <!-- Botón para reportar problema -->
      <div class="mt-4 max-w-md mx-auto">
        <a
          [routerLink]="['report']"
          class="btn btn-outline btn-warning w-full"
        >

          Reportar problema
        </a>
      </div>
    </section>

    <section class="mx-4 mt-4 md:mx-10">
      <h2 class="my-4 text-2xl md:text-3xl font-bold leading-tight">Descripción</h2>
    </section>

    <article class="m-4 p-4 rounded-lg md:mx-10 mt-4 bg-base-200">
      {{ bookResource.value()?.description }}
    </article>

    <section class="mx-4 mt-4 md:mx-10">
      <h2 class="my-4 text-2xl md:text-3xl font-bold leading-tight">Contenido</h2>
      <book-details-content [book]="bookResource.value()"></book-details-content>
    </section>
  }
</section>
